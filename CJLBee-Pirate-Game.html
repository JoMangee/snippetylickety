<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CJLBee's Pirate Game v8.3</title>
<style>
:root{--bg:#0b0f14;--panel:#141a22;--card:#1c242f;--line:#2b3542;--gold:#f5b83d;--green:#3fb950;--red:#f85149;--blue:#58a6ff;--purple:#c9a6ff;--dim:#8b949e}*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;max-width:100%;overflow-x:hidden}body{font-family:'Courier New',monospace;background:var(--bg);color:#fff;padding:clamp(10px,4vw,20px);line-height:1.5;max-width:1300px;margin:auto}h1{text-align:center;color:var(--gold);margin-bottom:5px;font-size:clamp(1.35em,5vw,1.8em);overflow-wrap:anywhere}h1 span{display:inline-block;font-size:.55em;background:var(--gold);color:var(--bg);padding:2px 6px;border-radius:999px;vertical-align:middle}.sub{text-align:center;color:var(--dim);font-size:.9em;margin-bottom:15px;overflow-wrap:anywhere}.modes{display:flex;gap:10px;margin-bottom:15px;flex-wrap:wrap}.mode{flex:1 1 150px;min-width:0;width:100%;padding:8px 12px;background:var(--card);border:2px solid var(--gold);color:var(--gold);cursor:pointer;font-weight:bold;border-radius:4px;white-space:normal;overflow-wrap:anywhere}.mode:hover,.mode.active{background:var(--gold);color:var(--bg)}.playmode,.playon{display:flex;align-items:center;justify-content:center;gap:8px;margin:8px 0;padding:8px;background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--dim);font-size:.9em;flex-wrap:wrap}.playmode label,.playon label{max-width:100%;overflow-wrap:anywhere}.playmode select{min-width:0;max-width:100%;padding:4px 6px;background:var(--card);border:1px solid var(--line);color:#fff;border-radius:3px}.playon input{width:18px;height:18px;accent-color:var(--gold)}.turn{text-align:center;font-size:clamp(1em,4vw,1.2em);color:var(--gold);margin:12px 0;font-weight:bold;overflow-wrap:anywhere}.layout{display:flex;gap:12px;flex-wrap:wrap;width:100%;max-width:100%}.board{flex:1 1 480px;min-width:0;width:100%;background:var(--panel);border:2px solid var(--line);border-radius:8px;padding:12px}.board.active{border-color:var(--gold);box-shadow:0 0 10px rgba(245,184,61,.35)}.board h2{color:var(--gold);font-size:1.1em;margin-bottom:8px;display:flex;justify-content:space-between;gap:8px;overflow-wrap:anywhere;word-break:break-word}.scores{display:flex;gap:6px;margin-bottom:9px;min-width:0}.stat{flex:1 1 0;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:5px;text-align:center;overflow-wrap:anywhere}.stat .l{font-size:9px;color:var(--dim);text-transform:uppercase}.stat .v{font-size:15px;font-weight:800}.cash{color:var(--green)}.bank{color:var(--blue)}.total{color:var(--gold)}.bank-info{color:var(--blue);font-size:.85em;margin-bottom:8px;overflow-wrap:anywhere}.grid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:3px;width:100%;max-width:100%}.cell{min-width:0;aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:3px;font-weight:bold;font-size:clamp(.5em,2.3vw,.72em);background:var(--card);border:1px solid var(--line);overflow:hidden}.cell.p{background:var(--green);color:var(--bg)}.cell.n{background:var(--red);color:#fff}.cell.bomb{background:#ff6b35;color:#fff}.cell.rob{background:var(--purple);color:#fff}.cell.atk{background:var(--blue);color:var(--bg)}.cell.swp,.cell.swr{background:#9e6a03;color:#fff}.cell.x2,.cell.x3{background:#636e7b;color:var(--gold)}.cell.used{opacity:.4;text-decoration:line-through}.controls{display:flex;gap:10px;margin:18px 0;flex-wrap:wrap;width:100%;max-width:100%}button{flex:1 1 120px;min-width:min(100px,100%);max-width:100%;padding:10px 15px;background:var(--card);border:2px solid var(--line);color:#fff;font-weight:bold;cursor:pointer;border-radius:4px;font-size:1em;white-space:normal;overflow-wrap:anywhere}button:hover:not(:disabled){background:var(--line);border-color:var(--gold)}button:disabled{opacity:.35;cursor:not-allowed}.handoff-toggle{display:flex;align-items:center;justify-content:center;gap:8px;flex:1 1 180px;min-width:0;padding:8px 12px;border:2px solid var(--line);border-radius:4px;background:var(--card);color:var(--dim);font-weight:bold;cursor:pointer;overflow-wrap:anywhere}.handoff-toggle.on{border-color:var(--green);color:var(--green)}.handoff-toggle input{width:18px;height:18px;accent-color:var(--green)}.handoff-notice{display:none;margin:10px auto 0;padding:8px 12px;text-align:center;color:var(--gold);border:1px solid var(--gold);border-radius:6px;background:var(--panel);font-weight:bold;max-width:700px;overflow-wrap:anywhere}.handoff-notice.show{display:block}.handoff-flash{animation:handoffFlash .9s ease-in-out 2;border-color:var(--gold)!important;box-shadow:0 0 18px var(--gold)!important}@keyframes handoffFlash{0%,100%{transform:scale(1);filter:brightness(1)}50%{transform:scale(1.015);filter:brightness(1.7)}}.log{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:15px;margin-top:20px;max-width:700px;width:100%;overflow:hidden}.log h3{color:var(--gold);margin-bottom:10px;font-size:1.1em}.log ul{list-style:none;max-height:300px;overflow-y:auto}.log li{color:var(--dim);font-size:.85em;padding:3px 0;border-bottom:1px solid var(--line);word-break:break-word}.banner{display:none;margin-top:20px;font-size:clamp(1em,4vw,1.3em);color:var(--gold);font-weight:bold;text-align:center;overflow-wrap:anywhere}.banner.win{display:block;color:var(--green)}.banner.lose{display:block;color:var(--red)}@media(max-width:600px){body{padding:10px}.modes{gap:6px}.mode{flex-basis:calc(50% - 3px);padding:8px 6px}.layout{gap:8px}.board{flex-basis:100%;padding:8px}.board h2{font-size:1em}.scores{gap:3px}.stat{padding:4px 2px}.stat .l{font-size:8px}.stat .v{font-size:13px}.grid{gap:2px}.controls{gap:6px;margin:12px 0}.controls button,.handoff-toggle{flex-basis:calc(50% - 3px);padding:9px 6px}.log{padding:10px}}
</style>
</head>
<body>
<h1>PIRATE GAME <span title="v8.3">8.3</span></h1>
<p class="sub">Cooper's invention — everyone plays the same square. Choose how squares behave, then play!</p>
<div class="modes"><button class="mode" id="mSolo">SOLO vs BOT</button><button class="mode" id="m2p">2 PLAYERS</button><button class="mode" id="m2b">2 + BOT</button></div>
<div class="playmode"><label for="playMode">Kid-friendly play:</label><select id="playMode"><option value="once" selected>Play once — used squares stay quiet</option><option value="random">Random — squares can repeat with different effects</option></select></div>
<div class="playon" id="poWrap"><input type="checkbox" id="playOnToggle"><label for="playOnToggle">PLAY ON — keep going past 30 turns</label></div>
<div class="turn" id="turn"></div><div class="layout" id="layout"></div>
<div class="controls"><button id="roll">ROLL</button><button id="bank">BANK</button><label class="handoff-toggle" id="handoffToggle"><input type="checkbox" id="autoHandoff"><span id="handoffLabel">AUTO HANDOFF: OFF</span></label><button id="handoff">HAND OFF</button><button id="new">NEW GAME</button></div>
<div class="handoff-notice" id="handoffNotice" aria-live="polite"></div><div class="log"><h3>Ship's Log</h3><ul id="shipLog"></ul></div><div class="banner" id="banner"></div>
<script>
const $=q=>document.querySelector(q),COLS='ABCDEFGHIJ',GAME_VERSION='8.3;;const SPEC=[{v:100,n:1},{v:100,n:1},{v:50,n:5},{v:125,n:4},{v:10,n:8},{v:-100,n:1},{v:-25,n:1},{v:-15,n:1},{v:-2,n:2},{v:-1,n:2}];
const ACTS=[{k:'atk',n:1},{k:'rob',n:1},{k:'swp',n:1},{k:'swr',n:1},{k:'bomb',n:1},{k:'x2',n:1},{k:'x3',n:1}];
let players=[],activeIdx=0,turn=1,totalTurns=30,lastRoll=null,hasActed=false,gameOver=false,autoHandoff=false,autoTimer=null;
const onceMode=()=>$('#playMode').value==='once';
const rnd=n=>Math.floor(Math.random()*n);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function makeGrid(){const items=[];SPEC.forEach(c=>{for(let i=0;i<s.n;i++)items.push({type:'p',v:s.v})});ACTS.forEach(a=>{for(let i=0;i<a.n;i++)items.push({type:a.k,v:0})});while(items.length<100)items.push({type:'e',v:0});return shuffle(items)}
function player(name,isBot=false){return{name,cash:0,bank:0,grid:makeGrid(),used:new Set(),bankLock:null,bankCd:0,isBot}}
function fmt(n){return n<0?'-'+Math.abs(n):String(n)}
function cellLabel(c){if(c.type==='p')return c.v>0?'+'+c.v:fmt(c.v);if(c.type==='x2'||c.type==='x3')return c.type;if(c.type==='bomb')return'BOMB';if(c.type==='rob')return'ROB';if(c.type==='atk')return'ATK';if(c.type==='swp')return'SWP';if(c.type==='swr')return'SWR';return''}
function cellClass(c){if(c.type==='p')return c.v>0?'p':c.v<0?'n':'b';return c.type}
function othersOf(p){return players.filter(x=>x!==p)}
function richestOther(p){const os=othersOf(p);returnos.length?os.reduce((best,o)=>o.cash>best.cash?o:best,os[0]):null}
