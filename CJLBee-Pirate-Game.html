<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CJLBee's Pirate Game v8</title>
<style>
:root{--bg:#0b0f14;--panel:#141a22;--card:#1c242f;--line:#2b3542;--gold:#f5b83d;--green:#3fb950;--red:#f85149;--blue:#58a6ff;--purple:#c9a6ff;--dim:#8b949e}*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Courier New',monospace;background:var(--bg);color:#fff;padding:20px;line-height:1.6}h1{color:var(--gold);margin-bottom:5px;font-size:1.8em}h1 span{display:inline-block}p.sub{color:var(--dim);font-size:.9em;margin-bottom:15px}.modes{display:flex;gap:10px;margin-bottom:20px}.mode{padding:8px 12px;background:var(--card);border:2px solid var(--gold);color:var(--gold);cursor:pointer;font-weight:bold;border-radius:4px;transition:.2s}.mode:hover{background:var(--gold);color:var(--bg)}.playmode{margin-bottom:10px;color:var(--dim);font-size:.9em}.playmode label{display:inline-block;margin-right:8px}.playmode select{padding:4px 6px;background:var(--card);border:1px solid var(--line);color:#fff;border-radius:3px;cursor:pointer}.playon{margin-bottom:15px}#playOnToggle{cursor:pointer;margin-right:6px}.turn{font-size:1.2em;color:var(--gold);margin-bottom:15px;font-weight:bold}.layout{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin:20px 0;max-width:600px}.board{border:2px solid var(--line);border-radius:6px;padding:15px;background:var(--panel)}.board.active{border-color:var(--gold);box-shadow:0 0 10px rgba(245,184,61,.5)}.board h2{color:var(--gold);font-size:1.1em;margin-bottom:10px}.board .cash{color:var(--green);font-weight:bold;margin-bottom:5px}.board .bank-info{color:var(--blue);font-size:.9em;margin-bottom:10px}.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}.cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:3px;font-weight:bold;font-size:.8em;cursor:pointer;background:var(--card);border:1px solid var(--line);transition:.2s}.cell:hover{background:var(--line)}.cell.p{background:var(--green);color:var(--bg)}.cell.n{background:var(--red);color:#fff}.cell.b{background:var(--panel);color:var(--dim)}.cell.bomb{background:#ff6b35;color:#fff}.cell.rob{background:var(--purple);color:#fff}.cell.atk{background:var(--blue);color:var(--bg)}.cell.swp,.cell.swr{background:#9e6a03;color:#fff}.cell.x2,.cell.x3{background:#636e7b;color:var(--gold)}.cell.used{opacity:.4;text-decoration:line-through}.controls{display:flex;gap:10px;margin:20px 0}button{padding:10px 15px;background:var(--card);border:2px solid var(--line);color:#fff;font-weight:bold;cursor:pointer;border-radius:4px;transition:.2s;font-size:1em}button:hover{background:var(--line);border-color:var(--gold)}button:active{transform:scale(.98)}.log{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:15px;margin-top:20px;max-width:600px}.log h3{color:var(--gold);margin-bottom:10px;font-size:1.1em}.log ul{list-style:none;max-height:300px;overflow-y:auto}.log li{color:var(--dim);font-size:.85em;padding:3px 0;border-bottom:1px solid var(--line);word-break:break-word}.log li:last-child{border:none}.banner{margin-top:20px;font-size:1.3em;color:var(--gold);font-weight:bold;text-align:center}.banner.win{color:var(--green)}.banner.lose{color:var(--red)}
</style>
</head>
<body>
<h1>PIRATE GAME v8 <span title="v8.1" style="font-size:.55em;background:var(--gold);color:var(--bg);padding:2px 6px;border-radius:999px;vertical-align:middle">8.1</span></h1>
<p class="sub">Cooper's invention — everyone plays the same square. Choose how squares behave, then play!</p>
<div class="modes"><button class="mode" id="mSolo">SOLO vs BOT</button><button class="mode" id="m2p">2 PLAYERS</button><button class="mode" id="m2b">2 + BOT</button></div>
<div class="playmode"><label for="playMode">Kid-friendly play:</label><select id="playMode"><option value="once" selected>Play once — used squares stay quiet</option><option value="random">Random — squares can repeat with different effects</option></select></div>
<div class="playon" id="poWrap"><input type="checkbox" id="playOnToggle"><label for="playOnToggle">PLAY ON — keep going past 30 turns</label></div>
<div class="turn" id="turn"></div><div class="layout" id="layout"></div>
<div class="controls"><button id="roll">ROLL</button><button id="bank">BANK</button><button id="handoff">HAND OFF</button><button id="new">NEW GAME</button></div>
<div class="log"><h3>Ship's Log</h3><ul id="shipLog"></ul></div><div class="banner" id="banner"></div>
<script>
const $=q=>document.querySelector(q),COLS='ABCDEFGHIJ';
const GAME_VERSION='8.1';
const SPEC=[{v:100,n:1},{v:100,n:1},{v:50,n:5},{v:25,n:4},{v:10,n:8},{v:-100,n:1},{v:-25,n:1},{v:-15,n:1},{v:-2,n:2},{v:-1,n:2}];
const ACTS=[{k:'atk',n:1},{k:'rob',n:1},{k:'swp',n:1},{k:'swr',n:1},{k:'bomb',n:1},{k:'x2',n:1},{k:'x3',n:1}];
let players=[],activeIdx=0,turn=1,totalTurns=30,lastRoll=null,hasActed=false,gameOver=false;
const onceMode=()=>$('#playMode').value==='once';
function rnd(n){return Math.floor(Math.random()*n)}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function makeGrid(){const items=[];SPEC.forEach(s=>{for(let i=0;i<s.n;i++)items.push({type:'p',v:s.v})});ACTS.forEach(a=>{for(let i=0;i<a.n;i++)items.push({type:a.k,v:0})});while(items.length<100)items.push({type:'e',v:0});return shuffle(items)}
function fmt(n){return n<0?'-'+Math.abs(n):String(n)}
function cellLabel(c){if(c.type==='p')return c.v>0?'+'+c.v:fmt(c.v);if(c.type==='x2'||c.type==='x3')return c.type;if(c.type==='bomb')return 'BOMB';if(c.type==='rob')return 'ROB';if(c.type==='atk')return 'ATK';if(c.type==='swp')return 'SWP';if(c.type==='swr')return 'SWR';return ''}
function cellClass(c){if(c.type==='p')return c.v>0?'p':c.v<0?'n':'b';if(c.type==='bomb')return 'bomb';if(c.type==='rob')return 'rob';if(c.type==='atk')return 'atk';if(c.type==='swp'||c.type==='swr')return c.type;if(c.type==='x2'||c.type==='x3')return c.type;return 'e'}
function othersOf(pl){return players.filter(p=>p!==pl)}
function richestOther(pl){const os=othersOf(pl);if(!os.length)return null;return os.reduce((best,o)=>o.cash>best.cash?o:best,os[0])}
function tickOwnerLock(pl){if(pl.bankCd>0)pl.bankCd--;if(pl.bankLock){pl.bankLock--;if(pl.bankLock===0){pl.cash+=pl.bank;pl.bank=0;pl.bankLock=null;pl.bankCd=2;log(pl.name+' banked money returned!')}}}
function applyEffect(pl,c){let msg='';if(c.type==='p'){if(c.v>0){pl.cash+=c.v;msg='+'+c.v}else{pl.cash=Math.max(0,pl.cash+c.v);msg=fmt(c.v)}}else if(c.type==='x2'){pl.cash*=2;msg='DOUBLE x2'}else if(c.type==='x3'){pl.cash*=3;msg='TRIPLE x3'}else if(c.type==='bomb'){pl.cash=Math.max(0,pl.cash-50);msg='BOMB -50'}else if(c.type==='rob'){const target=richestOther(pl);if(target){const stolen=Math.min(25,target.cash);pl.cash+=stolen;target.cash-=stolen;msg='ROB +'+stolen+' from '+target.name}else msg='ROB (nobody to steal from)'}else if(c.type==='atk'){const target=richestOther(pl);if(target){const dmg=Math.min(40,target.cash);target.cash-=dmg;msg='ATK -'+dmg+' to '+target.name}else msg='ATK (nobody to attack)'}else if(c.type==='swp'){const target=richestOther(pl);if(target){const tmp=pl.cash;pl.cash=target.cash;target.cash=tmp;msg='SWAP cash with '+target.name}else msg='SWAP (nobody to swap)'}else if(c.type==='swr'){const target=richestOther(pl);if(target){const tmp=pl.bank;pl.bank=target.bank;target.bank=tmp;msg='SWAP reserves with '+target.name}else msg='SWAP (nobody to swap)'}return msg}
function resolveCell(pl,coord){if(onceMode()&&pl.used.has(coord))return 'already used — quiet';const original=pl.grid[coord];if(onceMode())pl.used.add(coord);if(original.type==='swr'&&!onceMode())pl.grid[coord]={type:rnd(2)?'swp':'swr',v:0};const msg=applyEffect(pl,original);return msg}
function render(){const layout=$('#layout');layout.innerHTML='';players.forEach((pl,i)=>{const b=document.createElement('div');b.className='board b'+i+(i===activeIdx?' active':'');const h=document.createElement('h2');h.textContent=pl.name;b.appendChild(h);const cashDiv=document.createElement('div');cashDiv.className='cash';cashDiv.textContent='Cash: '+pl.cash;b.appendChild(cashDiv);if(pl.bank>0||pl.bankLock){const bankDiv=document.createElement('div');bankDiv.className='bank-info';bankDiv.textContent='Reserve: '+pl.bank+(pl.bankLock?' (locked)':'');b.appendChild(bankDiv)}const grid=document.createElement('div');grid.className='grid';for(let j=0;j<100;j++){const cell=document.createElement('div');cell.className='cell '+cellClass(pl.grid[j])+(pl.used.has(j)?' used':'');cell.textContent=cellLabel(pl.grid[j]);cell.title=COLS[j%10]+(Math.floor(j/10)+1);grid.appendChild(cell)}b.appendChild(grid);layout.appendChild(b)});const pl=players[activeIdx];if(!gameOver)$('#turn').textContent='Turn '+turn+' — '+pl.name+(lastRoll?', rolled '+lastRoll:'');else $('#turn').textContent='GAME OVER: '+pl.name+' wins!'}
function log(msg){const li=document.createElement('li');li.textContent=msg;$('#shipLog').prepend(li)}
function availableSquares(){const a=[];for(let i=0;i<100;i++)if(players.every(p=>!p.used.has(i)))a.push(i);return a}
function doRoll(){if(gameOver||hasActed)return;const on=$('#playOnToggle').checked;if(turn>totalTurns&&!on){log('PLAY ON is off — tick the toggle to keep going');return}const pl=players[activeIdx];tickOwnerLock(pl);if(pl.isBot&&pl.cash>=100&&!pl.bankLock&&pl.bankCd<=0&&Math.random()<.35){pl.bank=pl.cash;pl.cash=0;pl.bankLock=3;log(pl.name+' banked its cash (returns in 3 of its turns)')}const choices=onceMode()?availableSquares():null;if(onceMode()&&!choices.length){gameOver=true;render();return}const coord=onceMode()?choices[rnd(choices.length)]:rnd(100);lastRoll=coord;const label=COLS[coord%10]+(Math.floor(coord/10)+1);log('Turn '+turn+': '+pl.name+' rolled '+label+' — everyone plays this square');players.forEach(p=>{const result=resolveCell(p,coord);log(' '+p.name+': '+(result||'no square action'))});hasActed=true;turn++;if(onceMode()&&!availableSquares().length)gameOver=true;render()}
function doBank(){if(gameOver||hasActed)return;const on=$('#playOnToggle').checked;if(turn>totalTurns&&!on){log('PLAY ON is off — tick the toggle to keep going');return}const pl=players[activeIdx];if(pl.bankLock){log(pl.name+' — money already in bank');return}if(pl.bankCd>0){log(pl.name+' — bank on cooldown, '+pl.bankCd+' turns to go');return}tickOwnerLock(pl);pl.bank=pl.cash;pl.cash=0;pl.bankLock=3;log(pl.name+' banked all cash (returns in 3 of their own turns)');hasActed=true;turn++;render()}
function handOff(){if(!hasActed){log('roll or bank first');return}if(players.length===1)return;activeIdx=(activeIdx+1)%players.length;hasActed=false;lastRoll=null;render();if(players[activeIdx].isBot)setTimeout(botTurn,700)}
function botTurn(){if(gameOver||!players[activeIdx]||!players[activeIdx].isBot)return;if(!hasActed)doRoll();setTimeout(handOff,700)}
function newGame(mode){players=[];const p1={name:'P1',cash:0,bank:0,grid:makeGrid(),used:new Set(),bankLock:null,bankCd:0,isBot:false};players.push(p1);if(mode===1||mode===2)players.push({name:'P2',cash:0,bank:0,grid:makeGrid(),used:new Set(),bankLock:null,bankCd:0,isBot:false});if(mode===1||mode===3)players.push({name:'BOT',cash:0,bank:0,grid:makeGrid(),used:new Set(),bankLock:null,bankCd:0,isBot:true});activeIdx=0;turn=1;hasActed=false;gameOver=false;lastRoll=null;$('#shipLog').innerHTML='';log('New game started!');render()}
$('#mSolo').onclick=()=>newGame(1);$('#m2p').onclick=()=>newGame(2);$('#m2b').onclick=()=>newGame(3);
$('#roll').onclick=doRoll;$('#bank').onclick=doBank;$('#handoff').onclick=handOff;$('#playOnToggle').onchange=()=>{render();log($('#playOnToggle').checked?'PLAY ON! The game keeps going':'Play on toggle off')};$('#new').onclick=()=>newGame(1);
</script>
</body>
</html>
